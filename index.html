  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');
    const group = (urlParams.get('group') || 'A').toUpperCase();

    // DEFAULT PRESETS GAME KATA BERANTAI
    const DEFAULT_PRESETS = [
      {
        id: 'p1',

        teks_a: 'Apabila saudaramu berbuat dosa, tegurlah dia di bawah empat mata saja.',

    // DEFAULT QUESTIONS & CATEGORIES REFLEKSI UMAT
    let DEFAULT_QUESTIONS = [
      { id: 'q1', teks: 'Bagaimana kita menerapkan prinsip Teguran 4 Mata (Mat 18:15) dalam kehidupan sehari-hari?' },
      { id: 'q2', teks: 'Langkah konkret apa yang dapat kita lakukan untuk mencegah berkembangnya desas-desus/gosip?' }
    ];

    let DEFAULT_CATEGORIES = ['Keluarga', 'Lingkungan', 'Paroki', 'Masyarakat'];

    let localReflectionAnswers = [
      { id: 'a1', question_id: 'q1', category: 'Keluarga', jawaban: 'Saling mendengarkan secara pribadi tanpa emosi saat ada masalah.' },
      { id: 'a2', question_id: 'q1', category: 'Lingkungan', jawaban: 'Menegur tetangga secara berbisik dan sopan tanpa membicarakannya di grup WA.' },
      { id: 'a3', question_id: 'q2', category: 'Paroki', jawaban: 'Selalu melakukan klarifikasi (tabayyun) langsung ke pengurus seksi.' },
      { id: 'a4', question_id: 'q2', category: 'Masyarakat', jawaban: 'Tidak ikut menyebarkan berita atau desas-desus yang belum tentu benar.' }
    ];

    // DEFAULT SESSION STATE (DILENGKAPI active_mode: 'game' | 'reflection')
    let localSession = {
      id: 1,
      preset_id: 'p1',
      teks_a: DEFAULT_PRESETS[0].teks_a,
      teks_b: DEFAULT_PRESETS[0].teks_b,
      hasil_a: '',
      hasil_b: '',
      status: 'idle',
      show_secret: false,
      active_mode: 'game' // Default mode: 'game' (Kata Berantai) atau 'reflection' (Refleksi Umat)
    };

    // UTILS: Kalkulasi Akurasi & Distorsi
    function calcMetrics(original, result) {
      if (!result || !original) return { accuracy: 0, distortion: 100 };
      const origWords = original.trim().toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(/\s+/);
      const resWords = result.trim().toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(/\s+/);
      
      let matchCount = 0;
      origWords.forEach((word, idx) => {
        if (resWords[idx] === word) matchCount++;
      });
      
      const accuracy = Math.min(100, Math.round((matchCount / origWords.length) * 100));
      const distortion = 100 - accuracy;
      return { accuracy, distortion };
    }

    // UTILS: Visual Diff Highlight (Hijau = Benar, Merah = Salah/Berubah)
    function renderDiff(original, result, isSecretHidden) {
      if (isSecretHidden && (!result || result.trim() === '')) {
        return '<span class="text-amber-400/70 italic font-mono">🔒 Teks rahasia disembunyikan sampai pemain mengirim jawaban...</span>';
      }
      if (!result) return '<span class="text-slate-500 italic">Belum ada jawaban dari utusan terakhir...</span>';
      
      const origWords = (original || '').trim().split(/\s+/);
      const resWords = result.trim().split(/\s+/);

      return resWords.map((resWord, idx) => {
        const origWord = origWords[idx] || '';
        const cleanOrig = origWord.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        const cleanRes = resWord.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

        if (cleanOrig === cleanRes) {
          return `<span class="bg-emerald-950/80 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded font-medium mr-1 inline-block my-0.5">${resWord}</span>`;
        } else {
          return `<span class="bg-rose-950/80 text-rose-300 border border-rose-500/40 px-2 py-0.5 rounded font-medium line-through mr-1 inline-block my-0.5" title="Seharusnya: ${origWord}">${resWord}</span>`;
        }
      }).join(' ');
    }

    // TOGGLE QR MODAL KATA BERANTAI
    window.toggleQRModal = function() {
      const modal = document.getElementById('qrModal');
      if (!modal) return;

      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        modal.classList.remove('hidden');

        const baseUrl = window.location.origin + window.location.pathname;
        const urlA = baseUrl + '?role=player&group=A';
        const urlB = baseUrl + '?role=player&group=B';

        const linkA = document.getElementById('linkPlayerA');
        const linkB = document.getElementById('linkPlayerB');
        if (linkA) linkA.href = urlA;
        if (linkB) linkB.href = urlB;

        const qrA = document.getElementById('qrcodeA');
        const qrB = document.getElementById('qrcodeB');

        if (qrA && qrB && typeof QRCode !== 'undefined') {
          qrA.innerHTML = '';
          qrB.innerHTML = '';
          new QRCode(qrA, { text: urlA, width: 110, height: 110 });
          new QRCode(qrB, { text: urlB, width: 110, height: 110 });
        }
      } else {
        modal.classList.add('hidden');
      }
    };

    // TOGGLE QR MODAL REFLEKSI UMAT
    window.toggleQRReflectionModal = function() {
      const modal = document.getElementById('qrReflectionModal');
      if (!modal) return;

      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        modal.classList.remove('hidden');

        const baseUrl = window.location.origin + window.location.pathname;
        const urlUmat = baseUrl + '?role=player&mode=reflection';

        const linkUmat = document.getElementById('linkPlayerUmat');
        if (linkUmat) linkUmat.href = urlUmat;

        const qrUmat = document.getElementById('qrcodeUmat');

        if (qrUmat && typeof QRCode !== 'undefined') {
          qrUmat.innerHTML = '';
          new QRCode(qrUmat, { text: urlUmat, width: 140, height: 140 });
        }
      } else {
        modal.classList.add('hidden');
      }
    };

    // ==========================================
    // 1. TAMPILAN PLAYER (HP PEMAIN & HP UMAT)
    // ==========================================
    if (role === 'player') {
      const playerMode = urlParams.get('mode') || (localSession.active_mode === 'reflection' ? 'reflection' : 'game');

      // 1A. HP UMAT (FORM REFLEKSI ANONIM)
      if (playerMode === 'reflection') {
        renderPlayerReflectionUI();
      } 
      // 1B. HP PEMAIN (KATA BERANTAI SIMULATOR)
      else {
        renderPlayerGameUI();
      }

      function renderPlayerGameUI() {
        const isGroupA = group === 'A';
        const themeColor = isGroupA ? 'sky' : 'emerald';
        
        const app = document.getElementById('app');
        app.innerHTML = `
          <div class="glass-card p-6 rounded-3xl shadow-2xl max-w-md mx-auto mt-6 text-center border border-slate-800">
            <div class="inline-flex items-center justify-center space-x-2 bg-${themeColor}-950/80 border border-${themeColor}-500/50 px-4 py-1.5 rounded-full text-${themeColor}-400 font-black text-sm mb-4 uppercase tracking-wider">
              <span>UTUSAN TERAKHIR</span>
              <span>•</span>
              <span>KELOMPOK ${group}</span>
            </div>

            <h1 class="text-2xl font-black text-amber-400 mb-2">KataBerantai BKSN</h1>
            <p class="text-sm text-slate-300 mb-6 leading-relaxed">
              Ketik persis kalimat pesan yang kamu dengar dari bisikan teman sebelumnya, lalu tekan tombol kirim!
            </p>

            <div class="text-left mb-4">
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Pesan Bisikan yang Didengar:</label>
              <textarea id="playerInput" rows="4" class="w-full p-4 bg-slate-900/90 border border-slate-700 rounded-2xl text-white text-lg focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 transition resize-none placeholder-slate-600" placeholder="Ketik kalimat di sini..."></textarea>
            </div>

            <button id="btnSubmit" onclick="submitAnswer()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-4 rounded-2xl transition shadow-lg shadow-amber-500/20 active:scale-95 cursor-pointer text-lg tracking-wide">
              KIRIM JAWABAN KELOMPOK ${group}
            </button>

            <div id="statusMsg" class="mt-4 p-3 bg-emerald-950/80 border border-emerald-500/40 rounded-xl text-emerald-400 text-sm font-bold hidden flex items-center justify-center space-x-2">
              <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              <span>Jawaban berhasil terkirim ke Layar Utama!</span>
            </div>
          </div>
        `;

        window.submitAnswer = async function() {
          const text = document.getElementById('playerInput').value.trim();
          if (!text) return alert('Silakan ketik kalimat yang kamu dengar terlebih dahulu!');

          const btn = document.getElementById('btnSubmit');
          btn.disabled = true;
          btn.innerText = 'Mengirim...';

          const field = group === 'B' ? 'hasil_b' : 'hasil_a';

          if (supabaseClient) {
            try {
              const { data } = await supabaseClient.from('game_session').select('*').eq('id', 1).maybeSingle();
              
              const updatePayload = {
                id: 1,
                teks_a: data?.teks_a || localSession.teks_a,
                teks_b: data?.teks_b || localSession.teks_b,
                hasil_a: field === 'hasil_a' ? text : (data?.hasil_a || ''),
                hasil_b: field === 'hasil_b' ? text : (data?.hasil_b || ''),
                status: 'finished',
                show_secret: data?.show_secret ?? localSession.show_secret,
                active_mode: data?.active_mode || 'game'
              };

              const { error } = await supabaseClient.from('game_session').upsert(updatePayload);

              if (error) {
                alert('Gagal mengirim ke Supabase: ' + error.message);
                btn.disabled = false;
                btn.innerText = `KIRIM JAWABAN KELOMPOK ${group}`;
                return;
              }
            } catch (err) {
              console.error(err);
            }
          }

          localSession[field] = text;
          localSession.status = 'finished';

          document.getElementById('statusMsg').classList.remove('hidden');
          btn.innerText = '✓ JAWABAN TERKIRIM';
          btn.classList.replace('from-amber-500', 'from-slate-700');
          btn.classList.replace('to-amber-600', 'to-slate-800');
          btn.classList.add('text-slate-400');
        };
      }

      function renderPlayerReflectionUI() {
        const app = document.getElementById('app');
        app.innerHTML = `
          <div class="glass-card p-6 rounded-3xl shadow-2xl max-w-lg mx-auto mt-4 border border-slate-800">
            <div class="text-center mb-6">
              <div class="inline-flex items-center space-x-2 bg-amber-950/80 border border-amber-500/50 px-4 py-1.5 rounded-full text-amber-400 font-extrabold text-xs uppercase tracking-wider mb-2">
                <span>🔒 FORM REFLEKSI ANONIM UMAT</span>
              </div>
              <h1 class="text-2xl font-black text-amber-400">Refleksi BKSN 2026</h1>
              <p class="text-xs text-slate-300 mt-1">Sampaikan masukan & refleksi Anda secara jujur dan anonim (tanpa nama).</p>
            </div>

            <div class="space-y-5">
              <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">1. Pilih Pertanyaan BKSN:</label>
                <select id="refQuestionSelect" class="w-full p-3.5 bg-slate-900 border border-slate-700 rounded-2xl text-white text-sm focus:outline-none focus:border-amber-400">
                  ${DEFAULT_QUESTIONS.map(q => `<option value="${q.id}">${q.teks}</option>`).join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">2. Pilih Kategori Refleksi:</label>
                <div class="grid grid-cols-2 gap-2.5">
                  ${DEFAULT_CATEGORIES.map((cat, idx) => `
                    <label class="flex items-center space-x-2 bg-slate-900 p-3 rounded-xl border border-slate-700 cursor-pointer hover:border-amber-400/50 transition">
                      <input type="radio" name="refCategory" value="${cat}" ${idx === 0 ? 'checked' : ''} class="text-amber-500 focus:ring-amber-400">
                      <span class="text-xs font-bold text-slate-200">${cat}</span>
                    </label>
                  `).join('')}
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">3. Tuliskan Tanggapan / Refleksi Anda (Anonim):</label>
                <textarea id="refInputText" rows="4" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white text-sm focus:outline-none focus:border-amber-400 resize-none placeholder-slate-600" placeholder="Ketikkan pemikiran atau refleksi Anda di sini..."></textarea>
              </div>

              <button id="btnSubmitRef" onclick="submitReflectionAnswer()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-4 rounded-2xl transition shadow-lg shadow-amber-500/20 cursor-pointer text-base tracking-wide">
                KIRIM TANGGAPAN REFLEKSI
              </button>

              <div id="statusRefMsg" class="p-3 bg-emerald-950/80 border border-emerald-500/40 rounded-xl text-emerald-400 text-xs font-bold hidden text-center">
                ✓ Tanggapan Anda telah terkirim secara anonim ke Layar Utama!
              </div>
            </div>
          </div>
        `;

        window.submitReflectionAnswer = async function() {
          const text = document.getElementById('refInputText').value.trim();
          const questionId = document.getElementById('refQuestionSelect').value;
          const categoryEl = document.querySelector('input[name="refCategory"]:checked');
          const category = categoryEl ? categoryEl.value : 'Keluarga';

          if (!text) return alert('Silakan ketikkan tanggapan refleksi Anda terlebih dahulu!');

          const btn = document.getElementById('btnSubmitRef');
          btn.disabled = true;
          btn.innerText = 'Mengirim...';

          const newAns = {
            id: 'ans_' + Date.now(),
            question_id: questionId,
            category: category,
            jawaban: text,
            created_at: new Date().toISOString()
          };

          if (supabaseClient) {
            try {
              const { error } = await supabaseClient.from('reflection_answers').insert([{
                question_id: questionId,
                category: category,
                jawaban: text
              }]);
              if (error) console.error("Supabase insert answer error:", error);
            } catch (err) {
              console.error(err);
            }
          }

          localReflectionAnswers.push(newAns);

          document.getElementById('statusRefMsg').classList.remove('hidden');
          document.getElementById('refInputText').value = '';
          btn.disabled = false;
          btn.innerText = 'KIRIM TANGGAPAN LAINNYA';
        };
      }
    }

    // ==========================================
    // 2. TAMPILAN ADMIN CMS PANEL
    // ==========================================
    else if (role === 'admin') {
      function getAdminPin() {
        return localStorage.getItem('bksn_admin_pin') || '1234';
      }
      function setAdminPin(newPin) {
        localStorage.setItem('bksn_admin_pin', newPin);
      }

      function initAdminPanel() {
        const pin = prompt('Masukkan PIN Admin BKSN:');
        if (pin !== getAdminPin()) {
          alert('PIN Salah! Mengalihkan ke halaman utama...');
          window.location.href = 'index.html';
          return;
        }
        renderAdminUI();
      }

      async function renderAdminUI() {
        const app = document.getElementById('app');
        app.innerHTML = `
          <div class="glass-card p-6 sm:p-8 rounded-3xl shadow-2xl border border-slate-800 max-w-4xl mx-auto my-6">
            <div class="flex justify-between items-center pb-6 mb-6 border-b border-slate-800">
              <div>
                <h1 class="text-2xl font-black text-amber-400">CMS Admin BKSN 2026</h1>
                <p class="text-xs text-slate-400">Pengaturan Mode Aktif, Preset Game, Refleksi Umat & Ekspor Laporan</p>
              </div>
              <a href="index.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 font-bold px-4 py-2 rounded-xl transition">
                ← Kembali ke Layar Utama
              </a>
            </div>

            <!-- TAB PENGATURAN MODE AKTIF (GAME vs REFLEKSI) -->
            <div class="bg-amber-950/40 p-5 rounded-2xl border border-amber-500/30 mb-8">
              <h2 class="text-sm font-black text-amber-400 uppercase tracking-wider mb-3">⚙️ Pengaturan Mode Halaman Utama (Proyektor)</h2>
              <p class="text-xs text-slate-300 mb-4">Pilih tampilan mana yang ingin ditampilkan untuk publik/umat saat ini:</p>

            <p class="text-sm sm:text-base text-slate-200 leading-relaxed max-w-3xl mx-auto mb-3">
              "Apabila saudaramu berbuat dosa, tegurlah dia di bawah <strong class="text-amber-400">empat mata saja</strong>."
              <br><span class="text-xs text-slate-400 italic">— Matius 18:15</span>
            </p>
            <p class="text-xs sm:text-sm text-slate-300 max-w-2xl mx-auto leading-normal">
              Permainan ini membuktikan betapa mudahnya pesan mengalami <strong class="text-rose-400">distorsi dan bias</strong> saat berpindah dari mulut ke mulut. 
              Hindari desas-desus atau gosip di lingkungan. Selalu konfirmasi langsung secara pribadi!
            </p>
          </div>

          <!-- FOOTER COPYRIGHT HERIKRISMUNANTO -->
          <footer class="text-center py-4 border-t border-slate-800/80 text-xs text-slate-500 font-medium tracking-wide">
            © 2026 <span class="text-slate-400">KataBerantai BKSN</span> • Developed by <strong class="text-amber-400 font-bold">herikrismunanto</strong>
          </footer>
        `;

        if (isFinished && typeof confetti === 'function') {
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        }
      }

      // 3B. HOST MODE 2: REKAP REFLEKSI UMAT (DIKELOMPOKKAN PER KATEGORI REALTIME)
      async function renderReflectionHostUI() {
        let answers = localReflectionAnswers;
        if (supabaseClient) {
          try {
            const { data } = await supabaseClient.from('reflection_answers').select('*').order('created_at', { ascending: false });
            if (data && data.length > 0) answers = data;
          } catch(e) {}
        }

        app.innerHTML = `
          <!-- HEADER REFLEKSI BKSN -->
          <header class="flex flex-col sm:flex-row justify-between items-center my-6 gap-4 border-b border-slate-800/80 pb-6">
            <div class="text-center sm:text-left">
              <div class="inline-flex items-center space-x-2 bg-amber-950/60 border border-amber-500/30 text-amber-400 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider mb-2">
                <span>BKSN 2026</span>
                <span>•</span>
                <span>Pertemuan 3</span>
              </div>
              <h1 class="text-3xl font-black text-amber-400 tracking-wide">PAPAN REFLEKSI UMAT</h1>
              <p class="text-slate-400 text-xs sm:text-sm mt-0.5">Pengumpulan Tanggapan Umat Per Kategori (Anonim)</p>
            </div>

            <div class="flex items-center space-x-3">
              <button onclick="quickSwitchMode('game')" class="bg-sky-950/80 hover:bg-sky-900 border border-sky-500/50 text-sky-300 text-xs font-bold px-3 py-2.5 rounded-xl transition flex items-center space-x-1.5 cursor-pointer">
                <span>🔀 Mode Kata Berantai</span>
              </button>
              <button onclick="toggleQRReflectionModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs px-4 py-2.5 rounded-xl transition flex items-center space-x-2 cursor-pointer shadow">
                <span>📱 Scan QR Form Umat</span>
              </button>
              <a href="index.html?role=admin" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl transition shadow cursor-pointer">
                ⚙️ Admin CMS
              </a>
            </div>
          </header>

          <!-- DAFTAR PERTANYAAN & 4 KOLOM KATEGORI -->
          <div class="space-y-10 mb-8">
            ${DEFAULT_QUESTIONS.map((q, qIdx) => `
              <div class="glass-card p-6 rounded-3xl border border-slate-800">
                <div class="flex items-start space-x-3 mb-6">
                  <span class="bg-amber-500 text-slate-950 text-xs font-black px-3 py-1 rounded-lg">#${qIdx+1}</span>
                  <h3 class="text-lg font-bold text-amber-300 leading-snug">${q.teks}</h3>
                </div>

                <!-- 4 KOLOM KATEGORI -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  ${DEFAULT_CATEGORIES.map(cat => {
                    const catAnswers = answers.filter(a => a.question_id === q.id && a.category === cat);
                    return `
                      <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800/80">
                        <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                          <span class="text-xs font-black text-sky-400 uppercase tracking-wider">${cat}</span>
                          <span class="bg-slate-800 text-slate-400 text-[10px] px-2 py-0.5 rounded-full font-bold">${catAnswers.length} masukan</span>
                        </div>

                        <div class="space-y-2.5 max-h-[320px] overflow-y-auto pr-1">
                          ${catAnswers.length > 0 ? catAnswers.map(a => `
                            <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 text-xs text-slate-200 leading-relaxed relative">
                              <span class="text-amber-400/80 font-serif mr-1">“</span>${a.jawaban}<span class="text-amber-400/80 font-serif ml-1">”</span>
                            </div>
                          `).join('') : '<p class="text-[11px] text-slate-600 italic text-center py-4">Belum ada masukan</p>'}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <!-- FOOTER COPYRIGHT HERIKRISMUNANTO -->
          <footer class="text-center py-4 border-t border-slate-800/80 text-xs text-slate-500 font-medium tracking-wide">
            © 2026 <span class="text-slate-400">KataBerantai & Refleksi BKSN</span> • Developed by <strong class="text-amber-400 font-bold">herikrismunanto</strong>
          </footer>
        `;
      }

      window.quickSwitchMode = async function(newMode) {
        localSession.active_mode = newMode;
        if (typeof mainHostRouter === 'function') {
          mainHostRouter(localSession);
        }
        if (supabaseClient) {
          try {
            const { data } = await supabaseClient.from('game_session').select('*').eq('id', 1).maybeSingle();
            const payload = {
              id: 1,
              preset_id: data?.preset_id || localSession.preset_id || '1',
              teks_a: data?.teks_a || localSession.teks_a || '',
              teks_b: data?.teks_b || localSession.teks_b || '',
              hasil_a: data?.hasil_a || localSession.hasil_a || '',
              hasil_b: data?.hasil_b || localSession.hasil_b || '',
              status: data?.status || localSession.status || 'idle',
              show_secret: data?.show_secret ?? localSession.show_secret ?? false,
              active_mode: newMode
            };
            await supabaseClient.from('game_session').upsert(payload);
          } catch(e) {}
        }
      };

      // Realtime Fetch & Subscribe Host
      async function initHost() {
        mainHostRouter(localSession);

        if (!supabaseClient) return;

        async function fetchSession() {
          try {
            const { data } = await supabaseClient.from('game_session').select('*').eq('id', 1).maybeSingle();
            if (data) {
              localSession = { ...localSession, ...data };
              mainHostRouter(localSession);
            }
          } catch (err) {}
        }

        await fetchSession();

        // Polling 2s
        setInterval(fetchSession, 2000);

        // Realtime Listener Game & Answers
        try {
          supabaseClient.channel('game_channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'game_session' }, payload => {
              if (payload.new) {
                localSession = { ...localSession, ...payload.new };
                mainHostRouter(localSession);
              }
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'reflection_answers' }, () => {
              mainHostRouter(localSession);
            })
            .subscribe();
        } catch (err) {}
      }

      initHost();
    }
  </script>
</body>
