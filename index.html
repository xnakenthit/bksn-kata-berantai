    // UTILS: Kalkulasi Akurasi & Distorsi
    function calcMetrics(original, result) {
      if (!result || !original) return { accuracy: 0, distortion: 100 };
      const origWords = original.trim().toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(/\s+/);
      const resWords = result.trim().toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(/\s+/);
      
      let matchCount = 0;
      origWords.forEach((word, idx) => {
        if (resWords[idx] === word) matchCount++;
      });
      
      const accuracy = Math.min(100, Math.round((matchCount / origWords.length) * 100));
      const distortion = 100 - accuracy;
      return { accuracy, distortion };
    }

    // UTILS: Visual Diff Highlight (Hijau = Benar, Merah = Salah/Berubah)
    function renderDiff(original, result, isSecretHidden) {
      if (isSecretHidden && (!result || result.trim() === '')) {
        return '<span class="text-amber-400/70 italic font-mono">🔒 Teks rahasia disembunyikan sampai pemain mengirim jawaban...</span>';
      }
      if (!result) return '<span class="text-slate-500 italic">Belum ada jawaban dari utusan terakhir...</span>';
      
      const origWords = (original || '').trim().split(/\s+/);
      const resWords = result.trim().split(/\s+/);

      return resWords.map((resWord, idx) => {
        const origWord = origWords[idx] || '';
        const cleanOrig = origWord.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        const cleanRes = resWord.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

        if (cleanOrig === cleanRes) {
          return `<span class="bg-emerald-950/80 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded font-medium mr-1 inline-block my-0.5">${resWord}</span>`;
        } else {
          return `<span class="bg-rose-950/80 text-rose-300 border border-rose-500/40 px-2 py-0.5 rounded font-medium line-through mr-1 inline-block my-0.5" title="Seharusnya: ${origWord}">${resWord}</span>`;
        }
      }).join(' ');
    }

                <div class="glass-card p-5 sm:p-6 rounded-3xl border ${g.borderClass} shadow-xl relative overflow-hidden flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                      <div>
                        <h3 class="text-lg font-black ${g.textClass}">${g.label.toUpperCase()}</h3>
                        <p class="text-[11px] text-slate-400">Tim Bisikan</p>
                      </div>
                      <div class="text-right">
                        <span class="inline-block ${g.badgeClass} text-xs px-2.5 py-0.5 rounded-full font-bold">
                          Akurasi: ${m.accuracy}%
                        </span>
                        <p class="text-[10px] text-slate-400 mt-1">Distorsi: ${m.distortion}%</p>
                      </div>
                    </div>

                    <div class="space-y-4">
                      <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Teks Asli Pesan Bisikan:</label>
                        <div class="bg-slate-900/90 p-3.5 rounded-2xl text-xs sm:text-sm border border-slate-800 font-mono text-slate-200">
                          ${isSecretHidden ? '••••••••••••••••••••••••••••••••••••••••' : (orig || 'Belum diatur')}
                        </div>
                      </div>

                      <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Hasil Teks Utusan Terakhir:</label>
                        <div class="bg-slate-900/90 p-3.5 rounded-2xl text-xs sm:text-sm border border-slate-800 min-h-[75px] leading-relaxed">
                          ${renderDiff(orig, res, isSecretHidden)}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- PESAN REFLEKSI BKSN MATIUS 18:15 -->
          <div class="glass-card p-6 sm:p-8 rounded-3xl border border-amber-500/30 bg-gradient-to-r from-amber-950/30 via-slate-900/40 to-amber-950/30 text-center relative overflow-hidden mb-6">
            <div class="inline-flex items-center space-x-2 text-amber-400 font-extrabold text-sm mb-2">
              <span>💡 REFLEKSI PESAN BERANTAI</span>
            </div>
            <p class="text-sm sm:text-base text-slate-200 leading-relaxed max-w-3xl mx-auto mb-3">
              "Apabila saudaramu berbuat dosa, tegurlah dia di bawah <strong class="text-amber-400">empat mata saja</strong>."
              <br><span class="text-xs text-slate-400 italic">— Matius 18:15</span>
            </p>
            <p class="text-xs sm:text-sm text-slate-300 max-w-2xl mx-auto leading-normal">
              Permainan ini membuktikan betapa mudahnya pesan mengalami <strong class="text-rose-400">distorsi dan bias</strong> saat berpindah dari mulut ke mulut. 
              Hindari desas-desus atau gosip di lingkungan. Selalu konfirmasi langsung secara pribadi!
            </p>
          </div>

          <!-- FOOTER COPYRIGHT HERIKRISMUNANTO -->
          <footer class="text-center py-4 border-t border-slate-800/80 text-xs text-slate-500 font-medium tracking-wide">
            © 2026 <span class="text-slate-400">Pesan Berantai BKSN</span> • Developed by <strong class="text-amber-400 font-bold">HERIKRSIMUNANTO</strong>
          </footer>
        `;

        if (hasAnyAnswer && typeof confetti === 'function') {
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        }
      }

      // Realtime Fetch & Subscribe Host
      async function initHost() {
        renderGameHostUI(localSession);

        // LISTENER LOCAL CROSS-TAB SYNC (BROADCAST & STORAGE EVENT)
        if (syncChannel) {
          syncChannel.onmessage = (event) => {
            if (event.data && event.data.type === 'SESSION_UPDATE') {
              localSession = { ...localSession, ...event.data.session };
              renderGameHostUI(localSession);
            }
          };
        }

        window.addEventListener('storage', (e) => {
          if (e.key === 'bksn_show_secret') {
            localSession.show_secret = e.newValue === 'true';
            renderGameHostUI(localSession);
          }
          if (e.key === 'bksn_teks_data') {
            try { localSession.teks_data = JSON.parse(e.newValue); } catch(err){}
            renderGameHostUI(localSession);
          }
          if (e.key === 'bksn_group_count') {
            localSession.group_count = parseInt(e.newValue || '2');
            renderGameHostUI(localSession);
          }
        });

        if (!supabaseClient) return;

        async function fetchSession() {
          try {
            const { data } = await supabaseClient.from('game_session').select('*').eq('id', 1).maybeSingle();
            if (data) {
              localSession = { ...localSession, ...data };
              if (data.show_secret !== undefined) {
                localStorage.setItem('bksn_show_secret', data.show_secret ? 'true' : 'false');
              }
              if (data.group_count) {
                localStorage.setItem('bksn_group_count', data.group_count.toString());
              }
              if (data.teks_data) {
                localStorage.setItem('bksn_teks_data', JSON.stringify(data.teks_data));
              }
              if (data.hasil_data) {
                localStorage.setItem('bksn_hasil_data', JSON.stringify(data.hasil_data));
              }
              renderGameHostUI(localSession);
            }
          } catch (err) {}
        }

        await fetchSession();

        // Polling 2s
        setInterval(fetchSession, 2000);

        // Realtime Listener Game Session
        try {
          supabaseClient.channel('game_channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'game_session' }, payload => {
              if (payload.new) {
                localSession = { ...localSession, ...payload.new };
                if (payload.new.show_secret !== undefined) {
                  localStorage.setItem('bksn_show_secret', payload.new.show_secret ? 'true' : 'false');
                }
                if (payload.new.group_count) {
                  localStorage.setItem('bksn_group_count', payload.new.group_count.toString());
                }
                if (payload.new.teks_data) {
                  localStorage.setItem('bksn_teks_data', JSON.stringify(payload.new.teks_data));
                }
                if (payload.new.hasil_data) {
                  localStorage.setItem('bksn_hasil_data', JSON.stringify(payload.new.hasil_data));
                }
                renderGameHostUI(localSession);
              }
            })
            .subscribe();
        } catch (err) {}
      }

      initHost();
    }
  </script>
