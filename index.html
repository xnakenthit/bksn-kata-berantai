  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');
    const group = (urlParams.get('group') || 'A').toUpperCase();

    // DEFAULT PRESETS
    const DEFAULT_PRESETS = [
      {
        id: 'p1',
        judul: 'Pertemuan 3 - Teguran 4 Mata (Mat 18:15)',
        teks_a: 'Apabila saudaramu berbuat dosa, tegurlah dia di bawah empat mata saja.',

        judul: 'Pertemuan 3 - Dua Tiga Orang (Mat 18:20)',
        teks_a: 'Sebab di mana dua atau tiga orang berkumpul dalam Nama-Ku, Aku ada di tengah-tengah mereka.',
        teks_b: 'Sebab di mana dua atau tiga orang berkumpul dalam Nama-Ku, Aku ada di tengah-tengah mereka.'
      },
      {
        id: 'p3',
        judul: 'Pertemuan 3 - Variasi Kelompok Beda Teks',
        teks_a: 'Jika ia mendengarkan bahasamu, engkau telah mendapat kembali saudaramu.',
        teks_b: 'Jika ia tidak mendengarkan engkau, bawalah seorang atau dua orang lagi.'
      }
    ];

    // DEFAULT SESSION STATE
    let localSession = {
      id: 1,
      preset_id: 'p1',
      teks_a: DEFAULT_PRESETS[0].teks_a,
      teks_b: DEFAULT_PRESETS[0].teks_b,
      hasil_a: '',
      hasil_b: '',
      status: 'idle',
      show_secret: false
    };

    // UTILS: Kalkulasi Akurasi & Distorsi
    function calcMetrics(original, result) {
      if (!result || !original) return { accuracy: 0, distortion: 100 };
      const origWords = original.trim().toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(/\s+/);
      const resWords = result.trim().toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(/\s+/);
      
      let matchCount = 0;
      origWords.forEach((word, idx) => {
        if (resWords[idx] === word) matchCount++;
      });
      
      const accuracy = Math.min(100, Math.round((matchCount / origWords.length) * 100));
      const distortion = 100 - accuracy;
      return { accuracy, distortion };
    }

    // UTILS: Visual Diff Highlight (Hijau = Benar, Merah = Salah/Berubah)
    function renderDiff(original, result, isSecretHidden) {
      if (isSecretHidden && (!result || result.trim() === '')) {
        return '<span class="text-amber-400/70 italic font-mono">🔒 Teks rahasia disembunyikan sampai pemain mengirim jawaban...</span>';
      }
      if (!result) return '<span class="text-slate-500 italic">Belum ada jawaban dari utusan terakhir...</span>';
      
      const origWords = (original || '').trim().split(/\s+/);
      const resWords = result.trim().split(/\s+/);

      return resWords.map((resWord, idx) => {
        const origWord = origWords[idx] || '';
        const cleanOrig = origWord.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        const cleanRes = resWord.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

        if (cleanOrig === cleanRes) {
          return `<span class="bg-emerald-950/80 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded font-medium mr-1 inline-block my-0.5">${resWord}</span>`;
        } else {
          return `<span class="bg-rose-950/80 text-rose-300 border border-rose-500/40 px-2 py-0.5 rounded font-medium line-through mr-1 inline-block my-0.5" title="Seharusnya: ${origWord}">${resWord}</span>`;
        }
      }).join(' ');
    }

    // FUNGSI TOGGLE QR MODAL (STATIS - HANYA RENDER QR SAAT DIBUKA)
    window.toggleQRModal = function() {
      const modal = document.getElementById('qrModal');
      if (!modal) return;

      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        modal.classList.remove('hidden');

        const baseUrl = window.location.origin + window.location.pathname;
        const urlA = baseUrl + '?role=player&group=A';
        const urlB = baseUrl + '?role=player&group=B';

        const linkA = document.getElementById('linkPlayerA');
        const linkB = document.getElementById('linkPlayerB');
        if (linkA) linkA.href = urlA;
        if (linkB) linkB.href = urlB;

        const qrA = document.getElementById('qrcodeA');
        const qrB = document.getElementById('qrcodeB');

        if (qrA && qrB && typeof QRCode !== 'undefined') {
          qrA.innerHTML = '';
          qrB.innerHTML = '';
          new QRCode(qrA, { text: urlA, width: 110, height: 110 });
          new QRCode(qrB, { text: urlB, width: 110, height: 110 });
        }
      } else {
        modal.classList.add('hidden');
      }
    };

    // ==========================================
    // 1. TAMPILAN PLAYER (HP Pemain A / B)
    // ==========================================
    if (role === 'player') {
      const isGroupA = group === 'A';
      const themeColor = isGroupA ? 'sky' : 'emerald';
      
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="glass-card p-6 rounded-3xl shadow-2xl max-w-md mx-auto mt-6 text-center border border-slate-800">
          <div class="inline-flex items-center justify-center space-x-2 bg-${themeColor}-950/80 border border-${themeColor}-500/50 px-4 py-1.5 rounded-full text-${themeColor}-400 font-black text-sm mb-4 uppercase tracking-wider">
            <span>UTUSAN TERAKHIR</span>
            <span>•</span>
            <span>KELOMPOK ${group}</span>
          </div>

          <h1 class="text-2xl font-black text-amber-400 mb-2">KataBerantai BKSN</h1>
          <p class="text-sm text-slate-300 mb-6 leading-relaxed">
            Ketik persis kalimat pesan yang kamu dengar dari bisikan teman sebelumnya, lalu tekan tombol kirim!
          </p>

          <div class="text-left mb-4">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Pesan Bisikan yang Didengar:</label>
            <textarea id="playerInput" rows="4" class="w-full p-4 bg-slate-900/90 border border-slate-700 rounded-2xl text-white text-lg focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 transition resize-none placeholder-slate-600" placeholder="Ketik kalimat di sini..."></textarea>
          </div>

          <button id="btnSubmit" onclick="submitAnswer()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-4 rounded-2xl transition shadow-lg shadow-amber-500/20 active:scale-95 cursor-pointer text-lg tracking-wide">
            KIRIM JAWABAN KELOMPOK ${group}
          </button>

          <div id="statusMsg" class="mt-4 p-3 bg-emerald-950/80 border border-emerald-500/40 rounded-xl text-emerald-400 text-sm font-bold hidden flex items-center justify-center space-x-2">
            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span>Jawaban berhasil terkirim ke Layar Utama!</span>
          </div>
        </div>
      `;

      window.submitAnswer = async function() {
        const text = document.getElementById('playerInput').value.trim();
        if (!text) return alert('Silakan ketik kalimat yang kamu dengar terlebih dahulu!');

        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = 'Mengirim...';

        const field = group === 'B' ? 'hasil_b' : 'hasil_a';

        if (supabaseClient) {
          try {
            const { data } = await supabaseClient.from('game_session').select('*').eq('id', 1).maybeSingle();
            
            const updatePayload = {
              id: 1,
              teks_a: data?.teks_a || localSession.teks_a,
              teks_b: data?.teks_b || localSession.teks_b,
              hasil_a: field === 'hasil_a' ? text : (data?.hasil_a || ''),
              hasil_b: field === 'hasil_b' ? text : (data?.hasil_b || ''),
              status: 'finished',
              show_secret: data?.show_secret ?? localSession.show_secret
            };

            const { error } = await supabaseClient.from('game_session').upsert(updatePayload);

            if (error) {
              alert('Gagal mengirim ke Supabase: ' + error.message);
              btn.disabled = false;
              btn.innerText = `KIRIM JAWABAN KELOMPOK ${group}`;
              return;
            }
          } catch (err) {
            console.error(err);
          }
        }

        localSession[field] = text;
        localSession.status = 'finished';

        document.getElementById('statusMsg').classList.remove('hidden');
        btn.innerText = '✓ JAWABAN TERKIRIM';
        btn.classList.replace('from-amber-500', 'from-slate-700');
        btn.classList.replace('to-amber-600', 'to-slate-800');
        btn.classList.add('text-slate-400');
      };
    }

    // ==========================================
    // 2. TAMPILAN ADMIN CMS PANEL
    // ==========================================
    else if (role === 'admin') {
      function initAdminPanel() {
        const pin = prompt('Masukkan PIN Admin BKSN:');
        if (pin !== '1234') {
          alert('PIN Salah! Mengalihkan ke halaman utama...');
          window.location.href = 'index.html';
          return;
        }
        renderAdminUI();
      }

      async function renderAdminUI() {
        const app = document.getElementById('app');
        app.innerHTML = `
          <div class="glass-card p-6 sm:p-8 rounded-3xl shadow-2xl border border-slate-800 max-w-3xl mx-auto my-6">
            <div class="flex justify-between items-center pb-6 mb-6 border-b border-slate-800">
              <div>
                <h1 class="text-2xl font-black text-amber-400">CMS Admin KataBerantai</h1>
                <p class="text-xs text-slate-400">Kelola Preset Teks & Kontrol Sesi Permainan BKSN 2026</p>
              </div>
              <a href="index.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 font-bold px-4 py-2 rounded-xl transition">
                ← Kembali ke Layar Utama
              </a>
            </div>

            <!-- BAGIAN 1: KONTROL SESI GAME -->
            <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 mb-8">
              <h2 class="text-lg font-bold text-sky-400 mb-4 flex items-center space-x-2">
                <span>🎮 Kontrol Sesi Permainan</span>
              </h2>

              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Pilih Preset Teks BKSN:</label>
                  <select id="presetSelect" onchange="onPresetChange()" class="w-full p-3.5 bg-slate-950 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400">
                    <option value="">Memuat preset...</option>
                  </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Teks Kelompok A:</label>
                    <textarea id="adminTeksA" rows="3" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-sky-400"></textarea>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Teks Kelompok B:</label>
                    <textarea id="adminTeksB" rows="3" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-sky-400"></textarea>
                  </div>
                </div>

                <div class="flex items-center space-x-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                  <input type="checkbox" id="checkSecret" class="w-4 h-4 text-amber-500 bg-slate-900 border-slate-700 rounded focus:ring-amber-500">
                  <label for="checkSecret" class="text-xs text-slate-300 font-medium">Sembunyikan Kalimat Rahasia di Layar Host (Hanya muncul saat jawaban dikirim)</label>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                  <button onclick="startSession()" class="flex-1 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-950 font-black py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/10 cursor-pointer">
                    ▶ MULAI SESI GAME BARU
                  </button>
                  <button onclick="resetSession()" class="bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-600/50 font-bold px-6 py-3.5 rounded-xl transition cursor-pointer">
                    ↺ Reset Jawaban
                  </button>
                </div>
              </div>
            </div>

            <!-- BAGIAN 2: KELOLA PRESET (CRUD) -->
            <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 mb-8">
              <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-amber-400">📚 Kelola Preset Ayat/Pesan</h2>
                <button onclick="showAddPresetModal()" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 border border-amber-500/40 text-xs font-bold px-3 py-1.5 rounded-lg transition">
                  + Tambah Preset Baru
                </button>
              </div>

              <div id="presetsList" class="space-y-3">
                <!-- Preset items rendered here -->
              </div>
            </div>

            <!-- BAGIAN 3: PANDUAN SQL SUPABASE -->
            <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800">
              <h2 class="text-sm font-bold text-slate-300 mb-2">🛠️ Troubleshooting Supabase (SQL Setup)</h2>
              <p class="text-xs text-slate-400 mb-3">Jika pengiriman jawaban dari HP pemain tidak masuk atau ada error kolom, jalankan script ini di <strong>SQL Editor Supabase</strong> Anda:</p>
              <textarea readonly class="w-full p-3 bg-slate-950 text-emerald-400 font-mono text-[11px] border border-slate-800 rounded-xl leading-relaxed select-all" rows="8">
create table if not exists game_session (
  id int primary key default 1,
  preset_id text, teks_a text, teks_b text,
  hasil_a text, hasil_b text, status text, show_secret boolean default false
);
alter table game_session add column if not exists show_secret boolean default false;
alter table game_session disable row level security;
insert into game_session (id, status, show_secret) values (1, 'idle', false) on conflict (id) do nothing;
              </textarea>
            </div>
          </div>
        `;

        loadPresetsAdmin();
      }

      let currentPresets = DEFAULT_PRESETS;

      async function loadPresetsAdmin() {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('presets').select('*');
          if (data && data.length > 0) {
            currentPresets = data;
          }
        }
        
        const select = document.getElementById('presetSelect');
        select.innerHTML = '';
        currentPresets.forEach(p => {
          select.innerHTML += `<option value="${p.id}">${p.judul}</option>`;
        });

        if (currentPresets.length > 0) {
          onPresetChange();
        }

        renderPresetList();
      }

      window.onPresetChange = function() {
        const id = document.getElementById('presetSelect').value;
        const p = currentPresets.find(item => item.id == id);
        if (p) {
          document.getElementById('adminTeksA').value = p.teks_a;
          document.getElementById('adminTeksB').value = p.teks_b;
        }
      };

      function renderPresetList() {
        const container = document.getElementById('presetsList');
        container.innerHTML = '';
        currentPresets.forEach(p => {
          container.innerHTML += `
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-start gap-4">
              <div class="space-y-1">
                <h4 class="text-sm font-bold text-slate-200">${p.judul}</h4>
                <p class="text-xs text-sky-400 font-mono">A: ${p.teks_a}</p>
                <p class="text-xs text-emerald-400 font-mono">B: ${p.teks_b}</p>
              </div>
              <button onclick="deletePreset('${p.id}')" class="text-xs text-rose-400 hover:text-rose-300 font-semibold bg-rose-950/60 p-2 rounded-lg border border-rose-800/40 transition">
                Hapus
              </button>
            </div>
          `;
        });
      }

      window.startSession = async function() {
        const teksA = document.getElementById('adminTeksA').value.trim();
        const teksB = document.getElementById('adminTeksB').value.trim();
        const hideSecret = document.getElementById('checkSecret').checked;
        const presetId = document.getElementById('presetSelect').value;

        if (!teksA || !teksB) return alert('Teks Kelompok A dan B tidak boleh kosong!');

        const payload = {
          id: 1,
          preset_id: presetId,
          teks_a: teksA,
          teks_b: teksB,
          hasil_a: '',
          hasil_b: '',
          status: 'playing',
          show_secret: !hideSecret
        };

        if (supabaseClient) {
          const { error } = await supabaseClient.from('game_session').upsert(payload);
          if (error) alert('Error Supabase: ' + error.message);
        }

        localSession = { ...localSession, ...payload };
        alert(' Sesi permainan berhasil dimulai!');
      };

      window.resetSession = async function() {
        const payload = { id: 1, status: 'idle', hasil_a: '', hasil_b: '' };
        if (supabaseClient) {
          await supabaseClient.from('game_session').upsert(payload);
        }
        localSession = { ...localSession, ...payload };
        alert(' Sesi direset! Jawaban pemain dibersihkan.');
      };

      window.showAddPresetModal = async function() {
        const judul = prompt('Judul Preset (contoh: Pertemuan 3 - Sesi 1):');
        if (!judul) return;
        const teksA = prompt('Kalimat Rahasia Kelompok A:');
        if (!teksA) return;
        const teksB = prompt('Kalimat Rahasia Kelompok B (kosongkan jika sama dengan A):') || teksA;

        const newP = {
          id: 'p_' + Date.now(),
          judul,
          teks_a: teksA,
          teks_b: teksB
        };

        if (supabaseClient) {
          await supabaseClient.from('presets').insert([{ judul, teks_a: teksA, teks_b: teksB }]);
        }

        currentPresets.push(newP);
        loadPresetsAdmin();
      };

      window.deletePreset = async function(id) {
        if (!confirm('Hapus preset ini?')) return;
        if (supabaseClient) {
          await supabaseClient.from('presets').delete().eq('id', id);
        }
        currentPresets = currentPresets.filter(p => p.id != id);
        loadPresetsAdmin();
      };

      initAdminPanel();
    }

    // ==========================================
    // 3. TAMPILAN UTAMA / HOST (iPad & Proyektor)
    // ==========================================
    else {
      const app = document.getElementById('app');

      function renderHost(session) {
        const currentSession = session || localSession;
        
        const isFinished = currentSession.status === 'finished' || (currentSession.hasil_a && currentSession.hasil_b);
        const isSecretHidden = !currentSession.show_secret && !isFinished;

        const metricsA = calcMetrics(currentSession.teks_a || '', currentSession.hasil_a || '');
        const metricsB = calcMetrics(currentSession.teks_b || '', currentSession.hasil_b || '');

        let winnerBadge = '';
        if (isFinished && (currentSession.hasil_a || currentSession.hasil_b)) {
          if (metricsA.accuracy > metricsB.accuracy) {
            winnerBadge = `<div class="bg-sky-500/20 border border-sky-400 text-sky-300 px-4 py-2 rounded-xl text-center font-bold text-sm mb-6 animate-bounce">🏆 WINNER: KELOMPOK A (Distorsi Terendah: ${metricsA.distortion}%)</div>`;

              <button onclick="toggleQRModal()" class="bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center space-x-2 cursor-pointer shadow">
                <span>📱 Scan QR Pemain</span>
              </button>
              <a href="index.html?role=admin" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-xl transition shadow cursor-pointer">
                ⚙️ Admin CMS
              </a>
            </div>
          </header>

          ${winnerBadge}

          <!-- DUAL GROUP SIDE-BY-SIDE CONTAINER -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- KELOMPOK A -->
            <div class="glass-card p-6 rounded-3xl border border-sky-500/30 shadow-xl relative overflow-hidden">
              <div class="absolute top-0 right-0 w-32 h-32 bg-sky-500/5 rounded-full blur-2xl pointer-events-none"></div>

              <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-800">
                <div>
                  <h3 class="text-xl font-black text-sky-400">KELOMPOK A</h3>
                  <p class="text-xs text-slate-400">Tim Bisikan Pertama</p>
                </div>
                <div class="text-right">
                  <span class="inline-block bg-sky-950/80 border border-sky-500/40 text-sky-300 text-xs px-3 py-1 rounded-full font-bold">
                    Akurasi: ${metricsA.accuracy}%
                  </span>
                  <p class="text-[10px] text-slate-400 mt-1">Distorsi: ${metricsA.distortion}%</p>
                </div>
              </div>

              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Teks Asli Pesan Bisikan:</label>
                  <div class="bg-slate-900/90 p-4 rounded-2xl text-sm border border-slate-800 font-mono text-slate-200">
                    ${isSecretHidden ? '••••••••••••••••••••••••••••••••••••••••' : (currentSession.teks_a || 'Belum diatur')}
                  </div>

                <div>
                  <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Hasil Teks Utusan Terakhir:</label>

                    ${renderDiff(currentSession.teks_a, currentSession.hasil_a, isSecretHidden)}
                  </div>

              </div>
            </div>

            <!-- KELOMPOK B -->
            <div class="glass-card p-6 rounded-3xl border border-emerald-500/30 shadow-xl relative overflow-hidden">
              <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 rounded-full blur-2xl pointer-events-none"></div>

              <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-800">
                <div>

                  <p class="text-xs text-slate-400">Tim Bisikan Kedua</p>

                <div class="text-right">
                  <span class="inline-block bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 text-xs px-3 py-1 rounded-full font-bold">
                    Akurasi: ${metricsB.accuracy}%
                  </span>
                  <p class="text-[10px] text-slate-400 mt-1">Distorsi: ${metricsB.distortion}%</p>

          <!-- PESAN REFLEKSI BKSN MATIUS 18:15 -->
          <div class="glass-card p-6 sm:p-8 rounded-3xl border border-amber-500/30 bg-gradient-to-r from-amber-950/30 via-slate-900/40 to-amber-950/30 text-center relative overflow-hidden mb-8">
            <div class="inline-flex items-center space-x-2 text-amber-400 font-extrabold text-sm mb-2">
              <span>💡 REFLEKSI PESAN BERANTAI</span>

        if (isFinished && typeof confetti === 'function') {
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        }
      }

      // Realtime Fetch & Subscribe
      async function initHost() {
        renderHost(localSession);

        if (!supabaseClient) return;

        async function fetchSession() {
          try {
            const { data, error } = await supabaseClient.from('game_session').select('*').eq('id', 1).maybeSingle();
            if (error) console.error("Fetch error:", error);
            if (data) {
              localSession = { ...localSession, ...data };
              renderHost(localSession);
            } else {
              await supabaseClient.from('game_session').upsert([
                { id: 1, preset_id: 'p1', teks_a: DEFAULT_PRESETS[0].teks_a, teks_b: DEFAULT_PRESETS[0].teks_b, hasil_a: '', hasil_b: '', status: 'idle', show_secret: false }
              ]);
            }
          } catch (err) {
            console.error("Supabase fetch error:", err);
          }
        }

        await fetchSession();

        // Auto polling setiap 2 detik sebagai penjamin sinkronisasi realtime
        setInterval(fetchSession, 2000);

        // Realtime Listener
        try {
          supabaseClient.channel('game_channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'game_session' }, payload => {
              if (payload.new) {
                localSession = { ...localSession, ...payload.new };
                renderHost(localSession);
              }
            })
            .subscribe();
        } catch (err) {
          console.error("Realtime subscription error:", err);
        }
      }

      initHost();
    }
  </script>
